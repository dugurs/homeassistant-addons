configuration:
  ha_sse_url:
    name: "외부 HA MCP SSE URL"
    description: "ha-mcp HACS 커스텀 컴포넌트 등 외부 Streamable HTTP/SSE URL을 직접 지정할 때 사용합니다. 비워두면 로컬 stdio(uvx)로 자동 실행됩니다."
  api_key:
    name: "REST API 인증 토큰"
    description: "외부 클라이언트에서 애드온의 REST/SSE API에 접근할 때 사용할 인증 Bearer 토큰입니다. 비워두면 인증 없이 허용됩니다."
  api_port:
    name: "API 포트"
    description: "애드온의 상태 및 REST/SSE API를 제공할 포트 번호입니다. (기본값: 8000)"
  print_timeout:
    name: "CLI 응답 타임아웃"
    description: "CLI 추론 모드(agy)의 헤드리스 실행 최대 대기 시간입니다. (기본값: 5m)"
  enable_sandbox:
    name: "샌드박스 활성화"
    description: "Antigravity CLI 실행 시 샌드박스 격리 환경을 적용할지 여부입니다. (기본값: false)"
  dangerous_mode:
    name: "권한 자동 승인 (위험 모드)"
    description: "채팅(CLI 추론 모드)과 리모트 데몬에 --dangerously-skip-permissions 플래그를 적용합니다. 이 플래그가 없으면 agy가 무한 대기(hang)할 수 있으므로 켜두는 것을 권장합니다."
  auto_start_remote_control:
    name: "리모트 데몬 자동 시작"
    description: "애드온 부팅 시 백그라운드로 agy remote-control serve 데몬을 자동으로 시작합니다. 외부 웹 대시보드나 리모트 세션을 주로 사용할 때 유용합니다."
  enable_terminal:
    name: "웹 터미널 (ttyd/tmux) 활성화"
    description: "인그레스 웹 터미널(ttyd 및 tmux)을 실행할지 여부입니다. 최초 로그인 후 터미널을 사용하지 않을 때 끄면 메모리 사용량을 줄일 수 있습니다."
  chat_mode:
    name: "채팅 작동 모드"
    description: "웹 UI의 작동 모드를 선택합니다. full: 고속 스마트홈 제어 및 CLI 자율 추론 전체 사용 (기본값), fast_only: 모드 1(고속 스마트홈 제어)과 대화 내역 열람만 허용하여 메모리 스파이크(200~300MB)를 차단하는 RAM 보호 모드, monitoring: 웹 UI를 순수 모니터링 관제 대시보드로 전환."

