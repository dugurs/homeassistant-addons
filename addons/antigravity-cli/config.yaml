name: "Google Antigravity CLI"
description: "Run Google Antigravity CLI - HA Add-on"
version: "1.3.1"
slug: "antigravity-cli"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto

ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:format-color-text
panel_title: "Antigravity CLI"

ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Antigravity Status & REST API"

map:
  - addon_config:rw
  - homeassistant_config:rw
  - share:rw
  - media:rw
  - backup:rw
  - ssl:ro

homeassistant_api: true
hassio_api: true
hassio_role: manager

options:
  ha_sse_url: ""
  api_key: ""
  api_port: 8000
  print_timeout: "5m"
  enable_sandbox: false
  dangerous_mode: true
  auto_start_remote_control: false
  enable_terminal: true
  chat_mode: "full"
  enable_chat_ui: true
schema:
  ha_sse_url: "str?"
  api_key: "str?"
  api_port: "port?"
  print_timeout: "str?"
  enable_sandbox: "bool?"
  dangerous_mode: "bool?"
  auto_start_remote_control: "bool?"
  enable_terminal: "bool?"
  chat_mode: "list(full|fast_only|monitoring)?"
  enable_chat_ui: "bool?"
