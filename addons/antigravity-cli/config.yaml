name: "Google Antigravity CLI"
description: "Run Google Antigravity CLI - HA Add-on"
version: "1.0.0"
slug: "antigravity-cli"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto

ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:robot-excited
panel_title: "Antigravity"

map:
  - addon_config:rw
  - homeassistant_config:rw
  - share:rw
  - media:rw
  - backup:rw
  - ssl:ro

homeassistant_api: true
hassio_api: true
hassio_role: manager

options:
  ha_sse_url: ""
schema:
  ha_sse_url: "str?"
